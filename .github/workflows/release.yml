name: Publish Foundry Module

on:
  push:
    branches: [main]
    paths:
      - "module.json"
      - "scripts/**"
      - "styles/**"
      - "templates/**"
      - "lang/**"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout module
        uses: actions/checkout@v4
      - name: Validate manifest and build ZIP
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version module.json)"
          TAG="v${VERSION}"
          DOWNLOAD="$(jq -r .download module.json)"
          EXPECTED="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip"
          if [ "${DOWNLOAD}" != "${EXPECTED}" ]; then
            echo "::error::module.json download URL must be ${EXPECTED}"
            exit 1
          fi
          zip -q -r module.zip module.json README.md LICENSE lang scripts styles templates
      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version module.json)"
          TAG="v${VERSION}"
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" module.json module.zip --clobber
          else
            gh release create "${TAG}" module.json module.zip \
              --target "${GITHUB_SHA}" \
              --title "Token Hover Art ${TAG}" \
              --notes "Foundry VTT v14: unscaled floating art gallery, uncropped portraits and screen-aware HUD positioning."
          fi
