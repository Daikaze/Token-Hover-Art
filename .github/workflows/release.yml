# Build the module package when a GitHub release is published.
# The release gets two assets: module.json (the manifest that Foundry reads for updates) and module.zip.
# The release tag must be "v" + the version in module.json, and the download URL in module.json must
# point to this tag. Otherwise the job fails, so a release never ships a manifest that does not match its zip.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v4

      - name: Check that module.json matches the release tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(jq -r .version module.json)"
          DOWNLOAD="$(jq -r .download module.json)"
          EXPECTED_DOWNLOAD="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/module.zip"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Release tag ${TAG} does not match module.json version ${VERSION} (expected tag v${VERSION})."
            exit 1
          fi
          if [ "${DOWNLOAD}" != "${EXPECTED_DOWNLOAD}" ]; then
            echo "::error::module.json download is ${DOWNLOAD}, expected ${EXPECTED_DOWNLOAD}."
            exit 1
          fi

      - name: Build module.zip
        run: zip -r module.zip module.json README.md LICENSE lang scripts styles templates

      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" module.json module.zip --clobber
